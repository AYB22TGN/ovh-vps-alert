name: OVH VPS stock

on:
  # Surveillance arrêtée le 21 oct. 2026 (VPS commandé). Pour la relancer, remettre :
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Envoyer un message Telegram de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ovh-vps-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le stock
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TEST_TELEGRAM: ${{ inputs.test_telegram && '1' || '0' }}
        run: ./check.sh

      - name: Commiter state.json si modifié
        run: |
          if git diff --quiet -- state.json && git ls-files --error-unmatch state.json >/dev/null 2>&1; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: mise à jour du stock"
          git push
